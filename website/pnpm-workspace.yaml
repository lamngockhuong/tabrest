packages:
  - "."

# pnpm 11 defaults strictDepBuilds to true, so an unapproved dependency
# build script fails the install (including the implicit install pnpm runs
# before "pnpm run"). esbuild and sharp ship prebuilt binaries via their
# platform packages, so their build scripts are not required - decline them.
allowBuilds:
  esbuild: false
  sharp: false

# @tailwindcss/typography 0.5.20 (latest) pins postcss-selector-parser 6.0.10,
# which has GHSA-rj75-hqrm-r3gf (CPU exhaustion on long flat selectors). The fix
# is only in 7.1.6+. The built CSS is identical with 7.x; drop this override once
# typography depends on a patched version.
overrides:
  "@tailwindcss/typography>postcss-selector-parser": 7.1.6
